# Barrido diario de vencimientos documentales.
#
# Vive acá y no en un servicio aparte porque así la programación queda en el
# repositorio, a la vista y con historial: si mañana alguien cambia la hora o
# lo apaga, se ve en el diff. Un cron configurado a mano en un panel es una
# pieza de la operación que no está escrita en ninguna parte.
#
# El endpoint es idempotente: guarda qué umbral avisó de cada documento, así
# que si el barrido corre dos veces el mismo día no manda nada repetido.
name: Alertas diarias

on:
  schedule:
    # Cuatro intentos, no uno. Dos razones:
    #
    # 1. Chile cambia de hora. En invierno es UTC-4 y en verano UTC-3, así que
    #    las 08:00 de allá son las 12:00 UTC o las 11:00 UTC según el mes. Un
    #    solo cron acierta medio año.
    #
    # 2. El cron de GitHub Actions es "best effort": se atrasa y a veces
    #    directamente no corre. El 23-09-2026 la ejecución programada no se
    #    disparó nunca y ese día nadie recibió sus avisos, sin que ninguna
    #    pantalla se pusiera roja. Un aviso que falla en silencio es peor que
    #    no tener aviso, porque se cree que está funcionando.
    #
    # Repetir no duplica correos: el endpoint registra qué umbral avisó de
    # cada documento y de cada compromiso, así que el segundo intento del día
    # no manda nada. El costo de un intento de más es una llamada HTTP.
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
    - cron: "0 15 * * *"
    - cron: "0 19 * * *"
  # Para correrlo a mano desde la pestaña Actions cuando haga falta.
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Simular sin enviar correos"
        type: boolean
        default: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    strategy:
      # Los dos barridos son independientes: que falle el de compromisos no
      # tiene por qué impedir que salgan las alertas de documentos.
      fail-fast: false
      matrix:
        include:
          - nombre: Vencimientos documentales
            endpoint: document-alerts
          - nombre: Compromisos por cerrar
            endpoint: compromiso-alerts
    name: ${{ matrix.nombre }}
    steps:
      - name: Barrer
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY: ${{ inputs.dryRun && '1' || '0' }}
          ENDPOINT: ${{ matrix.endpoint }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Falta el secreto CRON_SECRET en la configuración del repositorio."
            exit 1
          fi

          RESPUESTA=$(curl -sS -w "\n%{http_code}" -X POST \
            "https://control.nomadechile.cl/api/cron/$ENDPOINT?dryRun=$DRY" \
            -H "Authorization: Bearer $CRON_SECRET")

          CODIGO=$(echo "$RESPUESTA" | tail -n1)
          CUERPO=$(echo "$RESPUESTA" | sed '$d')

          echo "$CUERPO"

          # Un fallo silencioso acá es peor que no tener alertas: se cree que
          # están funcionando. Si el endpoint no responde 200 -- lo que incluye
          # que un correo no haya salido -- la ejecución falla y GitHub avisa.
          if [ "$CODIGO" != "200" ]; then
            echo "El endpoint respondió $CODIGO"
            exit 1
          fi
