# Polymarket AI Radar — despliegue local.
#   cp .env.example .env
#   docker compose up -d --build
#   Dashboard: http://localhost:8501   API: http://localhost:8000/docs
name: polymarket-radar

x-app: &app
  build:
    context: .
    target: runtime
  image: polymarket-radar:0.1.0
  env_file:
    - path: .env
      required: false
  environment:
    RADAR_DATABASE_URL: postgresql+psycopg://radar:${POSTGRES_PASSWORD:-radar}@db:5432/radar
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar}
      POSTGRES_DB: radar
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${RADAR_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["python", "-m", "radar.cli", "db-upgrade"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    command: ["python", "-m", "radar.cli", "api", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${RADAR_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5

  scheduler:
    <<: *app
    command: ["python", "-m", "radar.cli", "scheduler"]

  dashboard:
    <<: *app
    command: ["python", "-m", "radar.cli", "dashboard", "--host", "0.0.0.0", "--port", "8501"]
    environment:
      RADAR_DATABASE_URL: postgresql+psycopg://radar:${POSTGRES_PASSWORD:-radar}@db:5432/radar
      RADAR_API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:${RADAR_DASHBOARD_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy

  tests:
    profiles: ["test"]
    build:
      context: .
      target: dev
    image: polymarket-radar:0.1.0-dev
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://radar:${POSTGRES_PASSWORD:-radar}@db:5432/radar_test
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
