[project]
name = "polymarket-radar"
version = "0.1.0"
description = "Polymarket AI Radar: ingesta, análisis y simulación (solo papel) de mercados de predicción"
readme = "README.md"
requires-python = ">=3.12,<3.14"
# Dependencias directas fijadas con '=='. El árbol completo (con hashes) está en
# uv.lock y requirements.lock; el contenedor instala desde requirements.lock.
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.6",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.6",
  "httpx==0.28.1",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "structlog==26.1.0",
  "apscheduler==3.11.3",
  "streamlit==1.66.1",
  "pandas==3.1.0",
  "numpy==2.5.4",
  "lxml==6.0.2",
  "scipy==1.18.1",
]

[project.scripts]
radar = "radar.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "respx==0.23.1",
  "ruff==0.17.2",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "S101",   # assert en tests
  "RUF001", "RUF002", "RUF003",  # textos en español con caracteres ambiguos
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"migrations/**" = ["E501"]
"src/radar/elections/report.py" = ["E501"]  # plantillas de texto Markdown
"src/radar/predict/report.py" = ["E501"]  # plantillas de texto Markdown

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra --strict-markers"
markers = [
  "db: requiere PostgreSQL (TEST_DATABASE_URL)",
  "live: consulta las APIs públicas reales de Polymarket (opt-in con RADAR_LIVE_TESTS=1)",
]
